name: Checks

on:
  - pull_request

env:
  VITE_FATHOM_SITE_ID: xxx

jobs:
  Version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '16.x'
      - name: Get package.json version
        run: echo PACKAGE_VERSION=$(node -p -e "require('./package.json').version") >> $GITHUB_ENV

      - name: Check if version has been updated
        id: check
        uses: EndBug/version-check@v2
        with:
          diff-search: true
      - name: Log when changed
        if: steps.check.outputs.changed == 'true'
        run: 'echo "Version change found in commit ${{ steps.check.outputs.commit }}! New version: ${{ steps.check.outputs.version }} (${{ steps.check.outputs.type }})"'
      - name: Fail if version not updated and PR base is master
        if: steps.check.outputs.changed == 'false' && github.event.pull_request.base.ref == 'master'
        run: exit 1

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '16.x'
      - name: Install deps
        run: npm install -g pnpm && pnpm install
      - name: Run build
        env:
          # Increase memory to avoid heap error
          # https://github.com/vitejs/vite/issues/2433
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm run build

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '16.x'
      - name: Install deps
        run: npm install -g pnpm && pnpm install
      - name: Run lint
        run: pnpm run lint
      - name: Run prettier
        run: pnpm run prettier
      - name: Run stylelint
        run: pnpm run stylelint

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '16.x'
      - name: Install deps
        run: npm install -g pnpm && pnpm install
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm run test:unit
